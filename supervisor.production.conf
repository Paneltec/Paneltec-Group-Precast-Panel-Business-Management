; Paneltec Group — production supervisor unit.
; Ops step: replace the dev entries in /etc/supervisor/conf.d/supervisord.conf
; with the units below, then:
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl restart all
; Do NOT edit ports (3000/8001) — the Kubernetes ingress terminates on those.

[program:backend]
command=/root/.venv/bin/uvicorn server:app --host 0.0.0.0 --port 8001 --workers 4 --no-server-header --proxy-headers
directory=/app/backend
autostart=true
autorestart=true
environment=APP_URL="https://app.paneltec.com.au"
stderr_logfile=/var/log/supervisor/backend.err.log
stdout_logfile=/var/log/supervisor/backend.out.log
stopasgroup=true
killasgroup=true

[program:frontend]
command=/app/frontend/node_modules/.bin/serve -s /app/frontend/build -l tcp://0.0.0.0:3000 --no-clipboard
directory=/app/frontend
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/frontend.err.log
stdout_logfile=/var/log/supervisor/frontend.out.log
stopasgroup=true
killasgroup=true

[program:mongodb]
command=/usr/bin/mongod --bind_ip_all --wiredTigerCacheSizeGB 1
autostart=true
autorestart=true
stderr_logfile=/var/log/mongodb.err.log
stdout_logfile=/var/log/mongodb.out.log
